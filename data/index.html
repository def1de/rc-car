<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Camera Stream</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 0;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                padding: 2rem;
                max-width: 90%;
                text-align: center;
            }

            h1 {
                color: #333;
                margin-bottom: 2rem;
                font-size: 2.5rem;
                font-weight: 300;
            }

            .video-container {
                position: relative;
                display: inline-block;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                background: #f0f0f0;
                margin-bottom: 2rem;
            }

            #video-stream {
                display: block;
                max-width: 100%;
                height: auto;
                border-radius: 15px;
            }

            .loading {
                padding: 4rem;
                color: #666;
                font-size: 1.2rem;
            }

            .controls {
                display: flex;
                gap: 1rem;
                justify-content: center;
                margin-top: 1rem;
            }

            .btn {
                padding: 0.75rem 1.5rem;
                border: none;
                border-radius: 25px;
                cursor: pointer;
                font-size: 1rem;
                font-weight: 500;
                transition: all 0.3s ease;
                text-decoration: none;
                display: inline-block;
            }

            .btn-primary {
                background: linear-gradient(45deg, #667eea, #764ba2);
                color: white;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }

            .btn-secondary {
                background: #f8f9fa;
                color: #495057;
                border: 2px solid #dee2e6;
            }

            .btn-secondary:hover {
                background: #e9ecef;
                transform: translateY(-2px);
            }

            .status {
                margin-top: 1rem;
                padding: 0.5rem 1rem;
                border-radius: 20px;
                font-size: 0.9rem;
                font-weight: 500;
            }

            .status.online {
                background: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }

            .status.offline {
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }

            @media (max-width: 768px) {
                .container {
                    padding: 1rem;
                    margin: 1rem;
                }

                h1 {
                    font-size: 2rem;
                }

                .controls {
                    flex-direction: column;
                    align-items: center;
                }
            }
        </style>
    </head>
    <body>
        <h1>Hi ;)</h1>

        <div class="container">
            <div
                id="controller-status"
                style="margin-bottom: 1rem; padding: 1rem; background: #f8f9fa; border-radius: 10px"
            >
                <h3>Controller Status: <span id="status-text">Not Connected</span></h3>
                <div id="axis-values" style="font-family: monospace; font-size: 0.9rem; margin-top: 0.5rem"></div>
                <div id="lt-value" style="margin-top: 0.5rem; font-weight: bold"></div>
            </div>

            <div id="gpio-status" style="margin-bottom: 1rem; padding: 1rem; background: #e8f5e8; border-radius: 10px">
                <h3>GPIO Pin States</h3>
                <div id="gpio-pins" style="font-family: monospace; font-size: 0.9rem; margin-top: 0.5rem">
                    <div>Loading GPIO data...</div>
                </div>
            </div>
        </div>

        <script>
            // Xbox Controller Support
            let gamepadConnected = false;
            let ltPressed = false;
            let lastSentTime = 0;
            let lastSentControls = null;
            const SEND_THROTTLE_MS = 1000 / 60;

            // Check for gamepad support
            if ("getGamepads" in navigator) {
                console.log("Gamepad API is supported");

                // Listen for gamepad connection
                window.addEventListener("gamepadconnected", function (e) {
                    console.log("Gamepad connected:", e.gamepad.id);
                    gamepadConnected = true;
                    updateControllerStatus(true, e.gamepad.id);
                });

                // Listen for gamepad disconnection
                window.addEventListener("gamepaddisconnected", function (e) {
                    console.log("Gamepad disconnected:", e.gamepad.id);
                    gamepadConnected = false;
                    updateControllerStatus(false);
                });

                // Poll gamepad state
                function pollGamepad() {
                    const gamepads = navigator.getGamepads();

                    for (let i = 0; i < gamepads.length; i++) {
                        const gamepad = gamepads[i];

                        if (gamepad) {
                            // Display all axis values in DOM
                            if (gamepad.axes.length > 0) {
                                const axisDisplay = gamepad.axes
                                    .map((value, index) => `Axis ${index}: ${value.toFixed(3)}`)
                                    .join(" | ");
                                document.getElementById("axis-values").textContent = axisDisplay;
                            }

                            // Track specific controller inputs
                            let steering = gamepad.axes[0] || 0; // Right stick horizontal
                            let backward = gamepad.axes[4] || 0; // Left Trigger (LT)
                            let forward = gamepad.axes[5] || 0; // Right Trigger (RT)

                            // Convert trigger values from -1 to 1 range to 0 to 1 range if needed
                            backward = (backward + 1) / 2;
                            if (backward < 0.05) backward = 0;

                            forward = (forward + 1) / 2;
                            if (forward < 0.05) forward = 0;

                            // Create controls dictionary
                            const controls = {
                                steering: steering,
                                backward: backward,
                                forward: forward,
                            };

                            // Display individual control values
                            document.getElementById("lt-value").innerHTML = `Steering: ${steering.toFixed(
                                3
                            )} | Backward (LT): ${backward.toFixed(3)} | Forward (RT): ${forward.toFixed(3)}`;

                            // Throttle sending to server - only send if enough time has passed or values changed significantly
                            const currentTime = Date.now();
                            const controlsChanged =
                                !lastSentControls ||
                                Math.abs(steering - lastSentControls.steering) > 0.05 ||
                                Math.abs(backward - lastSentControls.backward) > 0.05 ||
                                Math.abs(forward - lastSentControls.forward) > 0.05;

                            if (currentTime - lastSentTime > SEND_THROTTLE_MS && controlsChanged) {
                                lastSentTime = currentTime;
                                lastSentControls = { ...controls };

                                // Send controls to server
                                fetch("/controls", {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json",
                                    },
                                    body: JSON.stringify(controls),
                                })
                                    .then((response) => {
                                        if (!response.ok) {
                                            console.warn("Failed to send controls to server");
                                        }
                                    })
                                    .catch((error) => {
                                        console.warn("Error sending controls:", error);
                                    });
                            }
                        }
                    }

                    // Continue polling if gamepad is connected
                    if (gamepadConnected) {
                        requestAnimationFrame(pollGamepad);
                    }
                }

                // Start polling when a gamepad is connected
                function startPolling() {
                    if (gamepadConnected) {
                        setInterval(pollGamepad, 1000 / 60); // Poll at 60Hz
                    }
                }

                // Check for already connected gamepads
                function checkExistingGamepads() {
                    const gamepads = navigator.getGamepads();
                    for (let i = 0; i < gamepads.length; i++) {
                        if (gamepads[i]) {
                            gamepadConnected = true;
                            updateControllerStatus(true, gamepads[i].id);
                            startPolling();
                            break;
                        }
                    }
                }

                // Update controller status display
                function updateControllerStatus(connected, gamepadId = "") {
                    const statusText = document.getElementById("status-text");
                    if (connected) {
                        statusText.textContent = `Connected - ${gamepadId}`;
                        statusText.style.color = "green";
                    } else {
                        statusText.textContent = "Not Connected";
                        statusText.style.color = "red";
                        // Clear displays when disconnected
                        document.getElementById("axis-values").textContent = "";
                        document.getElementById("lt-value").textContent = "";
                    }
                }

                // Initialize gamepad checking
                checkExistingGamepads();

                // Start polling when gamepad connects
                window.addEventListener("gamepadconnected", startPolling);
            } else {
                console.log("Gamepad API is not supported in this browser");
            }

            // GPIO Status Polling
            function updateGPIOStatus() {
                fetch("/gpiodata")
                    .then((response) => response.json())
                    .then((data) => {
                        if (data.error) {
                            document.getElementById(
                                "gpio-pins"
                            ).innerHTML = `<div style="color: red;">Error: ${data.error}</div>`;
                        } else {
                            const pins = data.pins;
                            let html = '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">';

                            Object.entries(pins).forEach(([name, info]) => {
                                const isActive = info.state === "HIGH" || info.duty_cycle > 0;
                                const color = isActive ? "#4CAF50" : "#f44336";
                                const bgColor = isActive ? "#e8f5e8" : "#ffebee";

                                let stateText = info.state;
                                if (info.duty_cycle !== undefined && info.duty_cycle > 0) {
                                    stateText = `PWM ${info.duty_cycle.toFixed(1)}%`;
                                }

                                html += `
                                    <div style="
                                        padding: 8px; 
                                        border-radius: 5px; 
                                        background: ${bgColor};
                                        border-left: 4px solid ${color};
                                        font-size: 0.85rem;
                                    ">
                                        <strong>${name}</strong><br>
                                        Pin ${info.pin}: <span style="color: ${color}; font-weight: bold;">${stateText}</span>
                                    </div>
                                `;
                            });

                            html += "</div>";
                            document.getElementById("gpio-pins").innerHTML = html;
                        }
                    })
                    .catch((error) => {
                        document.getElementById(
                            "gpio-pins"
                        ).innerHTML = `<div style="color: red;">Failed to fetch GPIO data: ${error}</div>`;
                    });
            }

            // Update GPIO status every 200ms for real-time display
            setInterval(updateGPIOStatus, 200);

            // // Initial GPIO status update
            updateGPIOStatus();
        </script>
    </body>
</html>
